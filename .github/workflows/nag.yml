name: redo nag

on:
  schedule:
    # Every 3 hours on IST hour marks: 07:00 10:00 13:00 16:00 19:00 22:00 01:00 04:00
    # (the 01:00 and 04:00 pokes are skipped by NAG_QUIET_HOURS on the server).
    - cron: "30 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send even inside quiet hours / within 2h of the last mail"
        type: boolean
        default: false

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: Poke the brain
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://brain-gamma-five.vercel.app/api/nag?force=$FORCE")
          echo "HTTP $code"; cat /tmp/out; echo
          test "$code" = "200"
